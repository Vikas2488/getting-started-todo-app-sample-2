name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # TEST
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --target test \
            -t todo-test .

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --target final \
            -t todo-app:${{ github.sha }} .

      - name: Run Trivy
        run: |
          docker run --rm \
            aquasec/trivy:latest \
            image \
            --exit-code 0 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            todo-app:${{ github.sha }}

  # ==========================================
  # BUILD AND PUSH
  # ==========================================
  build-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image
        run: |
          docker build \
            --target final \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:latest .

      - name: Push commit image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:latest

  # ==========================================
  # DEPLOY TO EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create directories on EC2
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p /home/ubuntu/todo-app/nginx
            mkdir -p /home/ubuntu/todo-app

            echo "EC2 deployment directories ready"

      # Copy compose.yml
      - name: Copy compose.yml
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yml"
          target: "/home/ubuntu/todo-app"

      # Copy nginx configuration
      - name: Copy Nginx configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/nginx/default.conf"
          target: "/home/ubuntu/todo-app/nginx"

      # Deploy application
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            cd /home/ubuntu/todo-app

            echo "Checking deployment files..."

            ls -la
            echo ""
            echo "Nginx directory:"
            ls -la nginx

            echo ""
            echo "Checking compose.yml..."

            test -f compose.yml
            test -f nginx/default.conf

            echo "Files found"

            # Create .env
            cat > .env <<EOF
            IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:latest
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            EOF

            echo ".env created"

            # Validate environment variables
            test -n "${{ secrets.MYSQL_PASSWORD }}"

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo "Docker Hub login successful"

            # Validate Docker Compose file
            echo "Validating Docker Compose..."

            docker compose config -q

            echo "Docker Compose configuration is valid"

            # Pull images
            echo "Pulling Docker images..."

            docker compose pull

            # Start services
            echo "Starting services..."

            docker compose up -d --remove-orphans

            # Show status
            echo ""
            echo "Container status:"

            docker compose ps

            # Show logs if something failed
            echo ""
            echo "Checking container health..."

            if ! docker compose ps --status running | grep -q "todo-app"; then
              echo "WARNING: todo-app container may not be running"
              docker compose logs --tail=50 app
            fi

            # Cleanup unused images
            docker image prune -f

            echo ""
            echo "======================================"
            echo "Deployment completed"
            echo "======================================"
