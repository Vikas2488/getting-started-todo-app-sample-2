name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==================================================
  # TEST
  # ==================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test stage
        run: |
          docker build \
            --target test \
            -t todo-test .

  # ==================================================
  # SECURITY SCAN
  # ==================================================
  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --target final \
            -t todo-app:${{ github.sha }} .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-app:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # ==================================================
  # BUILD AND PUSH
  # ==================================================
  build-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image
        run: |
          docker build \
            --target final \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:latest .

      - name: Push image with commit tag
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:latest

  # ==================================================
  # DEPLOY TO AWS EC2
  # ==================================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Copy Compose and Nginx configuration
      # -----------------------------------------------
      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yml,deploy/nginx/default.conf"
          target: "/home/ubuntu/todo-app"

      # -----------------------------------------------
      # Deploy
      # -----------------------------------------------
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            cd ~/todo-app

            # Create Nginx directory
            mkdir -p nginx

            # Move copied Nginx configuration
            if [ -f deploy/nginx/default.conf ]; then
              cp deploy/nginx/default.conf nginx/default.conf
            fi

            # Create environment file
            cat > .env <<EOF
            IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-todo:latest
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            EOF

            echo "Environment file created"

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo "Docker Hub login successful"

            # Pull latest images
            docker compose pull

            # Start / recreate services
            docker compose up -d

            # Show running containers
            docker compose ps

            # Remove unused Docker images
            docker image prune -f

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"
